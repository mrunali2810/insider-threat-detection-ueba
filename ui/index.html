<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meridian Bank - SOC Authentication</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .bg-grid {
      background-size: 40px 40px;
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: -1;
    }
    input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 30px #0f172a inset !important;
      -webkit-text-fill-color: #f1f5f9 !important;
    }
  </style>
</head>
<body class="relative overflow-hidden flex items-center justify-center">
  
  <div class="bg-grid"></div>

  <div class="w-full max-w-md px-8 py-10 bg-[#111728] border border-slate-800 rounded-2xl shadow-2xl z-10 relative">
    
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="w-14 h-14 mx-auto mb-4 rounded-xl bg-gradient-to-tr from-cyan-600 to-indigo-600 flex items-center justify-center font-bold text-white shadow-lg text-xl">
        MB
      </div>
      <h1 class="text-2xl font-bold text-white tracking-wide">Meridian Bank & Trust</h1>
      <p class="text-xs text-slate-400 mt-1 font-mono uppercase tracking-widest">SOC Admin Portal</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-5" onsubmit="handleLogin(event)">
      
      <div class="space-y-1">
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wide">Admin Username</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
          </div>
          <input type="text" id="username" required placeholder="admin" class="w-full pl-10 pr-3 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-slate-200 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors">
        </div>
      </div>

      <div class="space-y-1">
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wide">Authentication Token</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
          </div>
          <input type="password" id="password" required placeholder="••••••••" class="w-full pl-10 pr-3 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-slate-200 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors">
        </div>
      </div>

      <!-- Error Message Box (Hidden by default) -->
      <div id="errorMsg" class="hidden text-xs text-rose-400 bg-rose-500/10 border border-rose-500/30 p-2 rounded flex items-center">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        <span>Invalid credentials. Try 'admin' / 'admin'.</span>
      </div>

      <button type="submit" class="w-full py-3 mt-4 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-lg shadow-lg transition-colors flex items-center justify-center space-x-2">
        <span>Initialize SOC Session</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
      </button>

    </form>
    
    <div class="mt-6 pt-4 border-t border-slate-800 text-center">
      <p class="text-[10px] text-slate-500">Unrestricted access is strictly prohibited.<br>Monitored by UEBA AI Core.</p>
    </div>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const errorDiv = document.getElementById('errorMsg');

      // Simple mock authentication for demo
      if (user.toLowerCase() === 'admin' && pass === 'admin') {
        errorDiv.classList.add('hidden');
        // Add a cool little loading effect before redirecting
        const btn = document.querySelector('button[type="submit"]');
        btn.innerHTML = `
          <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Authenticating...
        `;
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 800);
      } else {
        errorDiv.classList.remove('hidden');
        // Add a slight shake animation to the form
        const form = document.getElementById('loginForm');
        form.style.transform = 'translateX(5px)';
        setTimeout(() => form.style.transform = 'translateX(-5px)', 100);
        setTimeout(() => form.style.transform = 'translateX(5px)', 200);
        setTimeout(() => form.style.transform = 'translateX(0)', 300);
      }
    }
  </script>
</body>
</html>
